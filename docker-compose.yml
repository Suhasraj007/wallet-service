services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Host port 5433: 5432 is commonly taken on dev machines (native
      # Postgres.app, other projects' containers). In-network the app still
      # uses db:5432; this mapping is only for host-side psql/IDE access.
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wallet
      SPRING_DATASOURCE_USERNAME: wallet
      SPRING_DATASOURCE_PASSWORD: wallet
      JWT_SECRET: local-compose-only-secret-0123456789abcdef
      SPRING_PROFILES_ACTIVE: json
    ports:
      - "8080:8080"

volumes:
  dbdata:
